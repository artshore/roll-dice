<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Let the Dice decide!</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="bg-dark">
    <div class="chewy-regular px-4 py-5 text-center">
      <div class="py-5">
        <h1 class="display-1 fw-bold green-text">🎲 Roll The Dice!</h1>
        <div class="col-lg-6 mx-auto">
          <p class="my-4 fs-1 text-white">Roll the dice and let fate decide!</p>
          <div class="container d-flex justify-content-center gap-5 dices">
            <figure class="text-center">
              <img src="./img/perspective-dice-one.svg" height="250" alt="" />
              <figcaption class="fs-2 text-white">Player 1</figcaption>
            </figure>
            <figure class="text-center">
              <img src="./img/perspective-dice-four.svg" height="250" alt="" />
              <figcaption class="fs-2 text-white">Player 2</figcaption>
            </figure>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
  </body>
</html>
